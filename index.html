<body>  
        
    <div class="msg-container  hidden">
        <p id="msg">Winner</p>
 
    </div>
    

    <main>

        <div class="scoreboard">

             </div>
        </div>


        <h1>Tic-Tac-Toe Game😎</h1>
        <div class="container">
            <div class="current-player"> Current Turn:
                <span id="currentTurn"> X</span>
              </div>
              
            <div class="game">
                
                <button class="box"> </button> 
                <button class="box"> </button>  
                <button class="box"> </button>
                <button class="box"> </button>
                <button class="box"> </button>
                <button class="box"> </button>
                <button class="box"> </button>
                <button class="box"> </button>
                <button class="box"> </button>
                

            </div>
            <div class="Match"><h3>Match Status</h3>
                <div class="stat"><span>🏆Matches</span><p id="matches">0</p></div>

                <div class="stat"><span>⚖️Draws</span><p id="draws">0</p></div>
                
            </div>


        </div>  
        
         <audio id="clickSound" src="freesound_crunchpixstudio-button-394464.mp3"></audio>
              <audio id="music" src="mixkit-arcade-retro-game-over-213.wav" ></audio>
              <audio id="winSound" src="superpuyofans1234-winner-game-sound-404167.mp3" ></audio>

              
              
              
              <div class="options">
              <button id="resetbtn"><i class="fa-solid fa-repeat reset-icon"></i><span class="reset-text">reset</span></button>
             
            
                <button id="homebtn"><i class="fa-solid fa-house house-icon"></i><span class="home-text">home</span></button>
              

              <!-- hidden home menu -->
              <div  id="homemenu" class="hide">
               <button id="volumebtn">sound </button>
               <button id="themsbtn">thems</button>
               <button id="player">Player vs AI</button>
               <button id="players">Player vs Player</button>
              </div>
              </div>
